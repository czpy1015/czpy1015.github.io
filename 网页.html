<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作业主页</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: "Microsoft YaHei", sans-serif;
  }
  body {
    min-height: 100vh;
    background: url('https://i.imgur.com/6zXK7dH.png') no-repeat center center fixed;
    background-size: cover;
  }
  .student-id {
    position: fixed;
    top: 20px;
    left: 20px;
    font-size: 18px;
    color: #fff;
    font-weight: bold;
    text-shadow: 0 0 8px rgba(0,0,0,0.6);
  }
  .container {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .work-list {
    background: rgba(0, 0, 0, 0.5);
    backdrop-filter: blur(8px);
    border-radius: 12px;
    padding: 30px 40px;
    text-align: center;
  }
  .work-list h2 {
    color: #ffdd44;
    font-size: 22px;
    margin-bottom: 25px;
  }
  .work-list a {
    display: block;
    color: #fff;
    text-decoration: none;
    font-size: 18px;
    margin: 18px 0;
  }
  .work-list a:hover {
    color: #ffdd44;
  }
</style>
</head>
<body>
  <div class="student-id">学号:25051030347</div>
  <div class="container">
    <div class="work-list">
      <h2>课程作业列表</h2>
      <a href="#">作业1</a>
      <a href="#">作业2</a>
      <a href="#">作业3</a>
      <a href="#">作业4</a>
      <a href="#">作业5</a>
    </div>
  </div>
</body>
</html>
