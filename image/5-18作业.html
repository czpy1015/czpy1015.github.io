<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>蓝色渐变播放器图标</title>
    <style>
        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            
            background: linear-gradient(#b3e0ff, #4096ee);
        }

        .player-icon {
            width: 200px;
            height: 200px;
            
            background: linear-gradient(#74b9ff, #0984e3);
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-frame {
            width: 140px;
            height: 100px;
            background-color: #0673cc;
            border-radius: 10px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .screen-inner {
            width: 120px;
            height: 80px;
            
            background: linear-gradient(#d1eaff, #74b9ff);
            border-radius: 5px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-btn {
            width: 60px;
            height: 60px;
            background-color: #fff;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .play-arrow {
            width: 0;
            height: 0;
            border-top: 12px solid transparent;
            border-bottom: 12px solid transparent;
            border-left: 20px solid #0673cc;
        }
    </style>
</head>
<body>
    <div class="player-icon">
        <div class="screen-frame">
            <div class="screen-inner">
                <div class="play-btn">
                    <div class="play-arrow"></div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
